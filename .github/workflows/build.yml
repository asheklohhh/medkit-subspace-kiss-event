
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.8
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.8-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.8/bin" >> "$GITHUB_PATH"

      - name: Find and extract mod sources
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive not found!"
            exit 1
          fi

          echo "Found archive: $ARCHIVE"

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          BUILD_FILE="$(find extracted -type f -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("settings.gradle")
          s = p.read_text() if p.exists() else ""

          repo = "maven { url = 'https://maven.minecraftforge.net' }"

          if "https://maven.minecraftforge.net" not in s:
              pm = re.search(r'\bpluginManagement\s*\{', s)

              if not pm:
                  s = (
                      "pluginManagement {\n"
                      "    repositories {\n"
                      "        " + repo + "\n"
                      "        gradlePluginPortal()\n"
                      "        mavenCentral()\n"
                      "    }\n"
                      "}\n\n" + s
                  )
              else:
                  tail = s[pm.end():]
                  repos = re.search(r'\brepositories\s*\{', tail)

                  if repos:
                      pos = pm.end() + repos.end()
                      s = s[:pos] + "\n        " + repo + s[pos:]
                  else:
                      pos = pm.end()
                      s = (
                          s[:pos] +
                          "\n    repositories {\n        " + repo +
                          "\n        gradlePluginPortal()\n"
                          "        mavenCentral()\n    }\n" +
                          s[pos:]
                      )

          p.write_text(s)
          PY

          gradle --version
          gradle --no-daemon build

          mkdir -p "$GITHUB_WORKSPACE/output"

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"

          if [ -z "$JAR" ]; then
            echo "ERROR: No mod JAR was generated!"
            exit 1
          fi

          cp "$JAR" "$GITHUB_WORKSPACE/output/"

          echo "SUCCESS: JAR generated!"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Medkit-Subspace-Kiss-Event
          path: output/*.jar
          if-no-files-found: error
