
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract mod sources
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ARCHIVE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          BUILD_FILE="$(find extracted -type f -name build.gradle -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("settings.gradle")
          if not p.exists():
              raise SystemExit("settings.gradle not found!")

          s = p.read_text()
          repo = "maven { url = 'https://maven.minecraftforge.net' }"

          if repo not in s:
              pm = re.search(r'pluginManagement\s*\{', s)

              if pm:
                  r = re.search(r'repositories\s*\{', s[pm.end():])
                  if r:
                      pos = pm.end() + r.end()
                      s = s[:pos] + "\n        " + repo + s[pos:]
                  else:
                      pos = pm.end()
                      s = s[:pos] + "\n    repositories {\n        " + repo + "\n        gradlePluginPortal()\n        mavenCentral()\n    }\n" + s[pos:]
              else:
                  s = "pluginManagement {\n    repositories {\n        " + repo + "\n        gradlePluginPortal()\n        mavenCentral()\n    }\n}\n\n" + s

          p.write_text(s)
          PY

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"

          if [ -z "$JAR" ]; then
            echo "JAR file not found!"
            exit 1
          fi

          cp "$JAR" "$GITHUB_WORKSPACE/output/"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Medkit-Subspace-Kiss-Event
          path: output/*.jar
          if-no-files-found: error
