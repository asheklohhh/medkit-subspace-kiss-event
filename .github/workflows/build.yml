
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extract mod sources
        run: |
          unzip -q medkit_subspace_kiss_event_forge_1.20.1.zip -d extracted
          cd extracted/medkit_subspace_kiss_event
          gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Medkit-Subspace-Kiss-Event
          path: extracted/medkit_subspace_kiss_event/build/libs/*.jar
