
name: Build Minecraft Mod

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find and extract mod sources
        run: |
          ARCHIVE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "ZIP archive not found!"
            exit 1
          fi
          echo "Found archive: $ARCHIVE"
          unzip -q "$ARCHIVE" -d extracted

          BUILD_FILE="$(find extracted -name build.gradle -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "build.gradle not found in archive!"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          cd "$PROJECT_DIR"
          gradle build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Medkit-Subspace-Kiss-Event
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
